<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Kenangan - MyJourney</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        body { background: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
        .login-box { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .media-card { transition: all 0.25s ease; }
        .media-card:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(0,0,0,0.1); }
        video, img { border-radius: 8px; object-fit: cover; }
        input:focus { outline: none; box-shadow: 0 0 0 2px #3b82f644; }
        .tab-active { background: #eef2ff; color: #3b82f6; font-weight: 600; }
    </style>
</head>
<body class="min-h-screen">
    <div id="authPage" class="flex items-center justify-center min-h-screen px-4">
        <div class="login-box bg-white rounded-2xl p-6 w-full max-w-sm">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-gray-800">Galeri Kenangan</h1>
                <p class="text-gray-500 mt-1">MyJourney — Simpan Kenangan Tanpa Batas</p>
            </div>

            <div class="flex mb-6 rounded-lg bg-gray-100 p-1">
                <button id="tabLogin" class="flex-1 py-2 rounded-md tab-active">Login</button>
                <button id="tabRegis" class="flex-1 py-2 rounded-md text-gray-500">Registrasi</button>
            </div>

            <form id="formLogin" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" id="loginUser" placeholder="Masukkan username" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="loginPass" placeholder="Masukkan password" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 transition">Login</button>
            </form>

            <form id="formRegis" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Buat Username</label>
                    <input type="text" id="regisUser" placeholder="Minimal 3 karakter" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Buat Password</label>
                    <input type="password" id="regisPass" placeholder="Minimal 4 karakter" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                </div>
                <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg font-medium hover:bg-green-700 transition">Buat Akun</button>
            </form>
        </div>
    </div>

    <div id="mainPage" class="hidden">
        <header class="bg-white shadow-sm px-4 py-4 flex items-center justify-between sticky top-0 z-10">
            <h1 class="text-xl font-bold text-gray-800">MyJourney</h1>
            <div class="flex items-center gap-3">
                <span id="currentUser" class="text-sm text-gray-600 bg-gray-100 px-3 py-1 rounded-full">
                    <i class="fa-solid fa-user mr-1"></i> -
                </span>
                <button id="btnLogout" class="text-sm text-red-500 hover:text-red-600 font-medium">
                    <i class="fa-solid fa-right-from-bracket"></i> Keluar
                </button>
            </div>
        </header>

        <section class="px-4 py-6">
            <div class="bg-white rounded-xl p-5 shadow-sm">
                <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up text-blue-500"></i> Upload Media
                </h2>
                <label class="block border-2 border-dashed border-gray-300 rounded-lg p-8 text-center cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition">
                    <input type="file" id="fileInput" accept="image/*,video/*" multiple class="hidden">
                    <i class="fa-solid fa-images text-4xl text-gray-400 mb-2"></i>
                    <p class="text-gray-600 font-medium">Klik di sini untuk memilih file</p>
                    <p class="text-sm text-gray-400 mt-1">Bisa pilih banyak sekaligus — Gambar & Video — Tanpa Batas</p>
                </label>
            </div>
        </section>

        <section class="px-4 pb-12">
            <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                <i class="fa-solid fa-folder-open text-green-500"></i> Galeri Saya
                <span id="totalCount" class="text-sm font-normal text-gray-500">(0 file)</span>
            </h2>
            <div id="gallery" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4"></div>
            <p id="emptyMsg" class="text-center text-gray-400 py-16">
                <i class="fa-solid fa-images text-4xl mb-3"></i><br>
                Belum ada media. Yuk upload kenangan pertamamu!
            </p>
        </section>
    </div>

    <script>
        const authPage = document.getElementById('authPage');
        const mainPage = document.getElementById('mainPage');
        const formLogin = document.getElementById('formLogin');
        const formRegis = document.getElementById('formRegis');
        const tabLogin = document.getElementById('tabLogin');
        const tabRegis = document.getElementById('tabRegis');
        const currentUserEl = document.getElementById('currentUser');
        const btnLogout = document.getElementById('btnLogout');
        const fileInput = document.getElementById('fileInput');
        const gallery = document.getElementById('gallery');
        const emptyMsg = document.getElementById('emptyMsg');
        const totalCount = document.getElementById('totalCount');

        let activeUser = null;

        tabLogin.addEventListener('click', () => {
            formLogin.classList.remove('hidden');
            formRegis.classList.add('hidden');
            tabLogin.classList.add('tab-active');
            tabRegis.classList.remove('tab-active');
            tabRegis.classList.add('text-gray-500');
        });

        tabRegis.addEventListener('click', () => {
            formRegis.classList.remove('hidden');
            formLogin.classList.add('hidden');
            tabRegis.classList.add('tab-active');
            tabLogin.classList.remove('tab-active');
            tabLogin.classList.add('text-gray-500');
        });

        formRegis.addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('regisUser').value.trim();
            const pass = document.getElementById('regisPass').value;

            if (user.length < 3) return alert('Username minimal 3 karakter!');
            if (pass.length < 4) return alert('Password minimal 4 karakter!');

            const allUsers = JSON.parse(localStorage.getItem('mj_users') || '{}');
            if (allUsers[user]) return alert('Username sudah dipakai! Gunakan yang lain.');

            allUsers[user] = { password: pass, created: new Date().toISOString() };
            localStorage.setItem('mj_users', JSON.stringify(allUsers));

            alert('✅ Akun berhasil dibuat! Silakan Login.');
            tabLogin.click();
            document.getElementById('loginUser').value = user;
        });

        formLogin.addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value;

            const allUsers = JSON.parse(localStorage.getItem('mj_users') || '{}');
            if (!allUsers[user]) return alert('Username tidak terdaftar!');
            if (allUsers[user].password !== pass) return alert('Password salah!');

            activeUser = user;
            currentUserEl.innerHTML = `<i class="fa-solid fa-user mr-1"></i>${user}`;
            authPage.classList.add('hidden');
            mainPage.classList.remove('hidden');
            loadGallery();
        });

        btnLogout.addEventListener('click', () => {
            activeUser = null;
            mainPage.classList.add('hidden');
            authPage.classList.remove('hidden');
            gallery.innerHTML = '';
        });

        function getUserMedia() {
            const key = `mj_media_${activeUser}`;
            return JSON.parse(localStorage.getItem(key) || '[]');
        }

        function saveUserMedia(list) {
            localStorage.setItem(`mj_media_${activeUser}`, JSON.stringify(list));
        }

        function updateCounter() {
            const total = getUserMedia().length;
            totalCount.textContent = `(${total} file)`;
            emptyMsg.style.display = total === 0 ? 'block' : 'none';
        }

        fileInput.addEventListener('change', (e) => {
            if (!activeUser) return;
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            files.forEach(file => {
                if (!file.type.startsWith('image/') && !file.type.startsWith('video/')) return;

                const reader = new FileReader();
                reader.onload = function(event) {
                    const now = new Date();
                    const media = {
                        id: Date.now() + Math.random(),
                        src: event.target.result,
                        type: file.type.startsWith('image/') ? 'image' : 'video',
                        name: file.name,
                        date: now.toLocaleDateString('id-ID', {
                            day: 'numeric', month: 'long', year: 'numeric'
                        }),
                        time: now.toLocaleTimeString('id-ID', {
                            hour: '2-digit', minute: '2-digit'
                        }),
                        timestamp: now.getTime()
                    };

                    const list = getUserMedia();
                    list.unshift(media);
                    saveUserMedia(list);
                    renderOne(media, true);
                };
                reader.readAsDataURL(file);
            });

            fileInput.value = '';
        });

        function loadGallery() {
            gallery.innerHTML = '';
            const list = getUserMedia();
            list.forEach(item => renderOne(item, false));
            updateCounter();
        }

        function renderOne(item, prepend) {
            const div = document.createElement('div');
            div.className = 'bg-white rounded-xl p-3 shadow-sm media-card';
            div.innerHTML = `
                ${item.type === 'image'
                    ? `<img src="${item.src}" class="w-full h-44 object-cover rounded-lg">`
                    : `<video src="${item.src}" class="w-full h-44 object-cover rounded-lg" controls></video>`
                }
                <div class="mt-3">
                    <p class="text-xs text-gray-500"><i class="fa-solid fa-calendar mr-1"></i>${item.date}</p>
                    <p class="text-xs text-gray-500 mt-1"><i class="fa-solid fa-clock mr-1"></i>${item.time}</p>
                </div>
            `;

            if (prepend) gallery.prepend(div);
            else gallery.appendChild(div);
            updateCounter();
        }
    </script>
</body>
</html>
